# DigitalOcean App Platform spec.
# Deploy:  doctl apps create --spec .do/app.yaml
# Then set the secret values in the App Platform dashboard (Settings > Environment Variables).
name: receipt-snap
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/receipt-snap   # change this
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
    envs:
      - key: DATABASE_URL        # Tiger Cloud connection string (postgres://tsdbadmin:...@...tsdb.cloud.timescale.com:...)
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: APP_PASSWORD        # protects your receipts on the public URL
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: GEMINI_MODEL
        scope: RUN_TIME
        value: gemini-flash-latest
      - key: TIMEZONE
        scope: RUN_TIME
        value: America/New_York
